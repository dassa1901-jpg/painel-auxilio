<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Auxílio</title>

<style>
*{box-sizing:border-box}
:root{
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --glass:rgba(22,14,35,.72);
  --error:#ff6b81;
}
html,body{
  margin:0;height:100%;
  background:radial-gradient(circle at top,#12001f,#000);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui;
  overflow:hidden;
}
.screen{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  transition:.6s ease;
}

/* LOGIN */
.login{
  width:min(92vw,340px);
  background:var(--glass);
  backdrop-filter:blur(20px);
  border-radius:32px;
  padding:26px 22px;
  text-align:center;
  box-shadow:0 24px 48px rgba(0,0,0,.55);
  animation:fade .6s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

.login h1{margin:0;font-size:20px}
.prod{font-size:12px;opacity:.65;margin:6px 0 18px}

/* FIELD */
.field{
  display:flex;align-items:center;
  background:rgba(255,255,255,.06);
  border-radius:18px;
  padding:12px 14px;
  gap:8px;
}
.field input{
  flex:1;background:transparent;border:0;outline:0;
  color:#fff;text-align:center;font-size:15px
}
.eye{
  font-size:15px;
  cursor:pointer;
  transition:.3s;
}
.eye.active{
  transform:scale(1.2);
  text-shadow:0 0 12px var(--accent);
}

/* ERROR */
.error{
  margin-top:10px;font-size:12px;color:var(--error);
  opacity:0;transform:translateY(-4px);transition:.3s
}
.error.show{opacity:1;transform:translateY(0)}

/* BUTTON */
.btn{
  margin-top:16px;width:100%;padding:14px;
  border:0;border-radius:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:15px;font-weight:500;
  box-shadow:0 10px 20px rgba(139,92,246,.45)
}
.btn:disabled{opacity:.4}

/* ENTRY */
.entry{
  width:min(92vw,320px);
  background:var(--glass);
  backdrop-filter:blur(20px);
  border-radius:28px;
  padding:26px;text-align:center;
  animation:purpleFlash .6s ease;
}
@keyframes purpleFlash{
  0%{box-shadow:0 0 0 rgba(139,92,246,0)}
  50%{box-shadow:0 0 40px rgba(139,92,246,.9)}
  100%{box-shadow:0 0 0 rgba(139,92,246,0)}
}
.entry h2{margin:0 0 6px;font-size:17px}
.entry p{margin:0;font-size:13px;opacity:.8}
.loader{
  margin:18px auto 0;width:44px;height:44px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);
  animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

/* PANEL */
.panel{
  width:min(92vw,340px);
  background:var(--glass);
  backdrop-filter:blur(20px);
  border-radius:32px;
  box-shadow:0 24px 48px rgba(0,0,0,.55);
  animation:float 6s ease-in-out infinite, fade .6s ease;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.header{text-align:center;padding:18px}
.header h2{margin:0;font-size:18px}
.header span{font-size:12px;opacity:.7}

.tabs{display:flex;gap:8px;padding:0 14px 8px}
.tab{
  flex:1;padding:10px 0;text-align:center;
  font-size:13px;font-weight:500;
  background:rgba(255,255,255,.06);
  border-radius:14px;
}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2))
}

.content{padding:14px 18px 18px}
.option{
  display:flex;justify-content:space-between;
  align-items:center;padding:10px 0;font-size:14px;
  border-bottom:1px solid rgba(255,255,255,.06)
}
.option:last-child{border-bottom:0}

.toggle{
  width:48px;height:28px;border-radius:28px;
  background:#2a2a2a;position:relative;transition:.25s
}
.toggle::after{
  content:"";width:24px;height:24px;border-radius:50%;
  background:#fff;position:absolute;top:2px;left:2px;transition:.25s
}
.toggle.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2))
}
.toggle.on::after{left:22px}

/* PRECISÃO EXTRA */
.slider{margin-top:16px}
.slider label{font-size:12px;opacity:.85}
input[type=range]{
  -webkit-appearance:none;width:100%;height:8px;
  margin-top:10px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:8px;
  box-shadow:0 0 14px rgba(139,92,246,.6)
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:20px;height:20px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 10px rgba(139,92,246,.8)
}

/* INJECT */
.inject{
  width:100%;margin-top:18px;padding:14px;
  border:0;border-radius:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:15px;font-weight:500
}
.inject.injecting{animation:pulse 1.2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 rgba(139,92,246,0)}
  50%{box-shadow:0 0 26px rgba(139,92,246,.75)}
  100%{box-shadow:0 0 0 rgba(139,92,246,0)}
}

.progress{
  height:6px;background:rgba(255,255,255,.1);
  border-radius:6px;overflow:hidden;
  margin-top:12px;display:none
}
.bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2))
}
.msg{
  margin-top:10px;text-align:center;
  font-size:12px;opacity:.85
}
.msg.done{
  font-weight:600;
  text-shadow:0 0 14px rgba(139,92,246,.8)
}

/* INFO */
.info{display:grid;gap:10px}
.card{
  background:rgba(255,255,255,.06);
  border-radius:18px;padding:12px 14px;
  display:flex;justify-content:space-between;font-size:13px
}

.footer{text-align:center;font-size:11px;opacity:.55;padding:10px}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="screen" id="login">
  <div class="login">
    <h1>painel auxílio</h1>
    <div class="prod">produção @hopexzj</div>

    <div class="field">
      <input type="password" id="pass" placeholder="senha" oninput="hideError()">
      <div class="eye" id="eye" onclick="togglePass()">👁️</div>
    </div>

    <div class="error" id="error"></div>
    <button class="btn" id="btnEnter" onclick="enter()">Entrar</button>
  </div>
</div>

<!-- ENTRY -->
<div class="screen" id="entry" style="opacity:0;pointer-events:none">
  <div class="entry">
    <h2 id="stepTitle">Entrando</h2>
    <p id="stepText">aguarde…</p>
    <div class="loader"></div>
  </div>
</div>

<!-- APP -->
<div class="screen" id="app" style="opacity:0;pointer-events:none">
  <div class="panel">
    <div class="header">
      <h2>painel auxílio</h2>
      <span>produção @hopexzj</span>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="tab('fun')">Funções</div>
      <div class="tab" onclick="tab('info')">Info</div>
    </div>

    <div class="content" id="fun">
      <div class="option"><span>Aimbot</span><div class="toggle"></div></div>
      <div class="option"><span>Aim Loc</span><div class="toggle"></div></div>
      <div class="option"><span>Aim FOV</span><div class="toggle"></div></div>
      <div class="option"><span>No Recoil</span><div class="toggle"></div></div>

      <div class="slider">
        <label>Precisão Extra <b><span id="pv">0</span>%</b></label>
        <input type="range" min="0" max="100" value="0" oninput="pv.innerText=this.value">
      </div>

      <button class="inject" onclick="inject()">Injetar</button>
      <div class="progress" id="prog"><div class="bar" id="bar"></div></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="content" id="info" style="display:none">
      <div class="info">
        <div class="card"><span>📱 Sistema</span><b>Android</b></div>
        <div class="card"><span>⏳ Expiração</span><b>∞</b></div>
        <div class="card"><span>🛡️ Status</span><b>Ativo</b></div>
        <div class="card"><span>📦 Versão</span><b>1.0</b></div>
      </div>
    </div>

    <div class="footer">produção @hopexzj</div>
  </div>
</div>

<script>
let tries=3, blocked=false, timer;

function togglePass(){
  pass.type = pass.type==="password"?"text":"password";
  eye.classList.toggle("active");
}

function enter(){
  if(blocked)return;

  if(pass.value==="hopexzjff"){
    login.style.opacity=0;
    setTimeout(()=>{
      login.style.display="none";
      entry.style.opacity=1;
      entry.style.pointerEvents="all";
      steps();
    },500);
  }else{
    tries--;
    if(tries>0){
      error.innerText=`Senha incorreta • ${tries} tentativas`;
    }else{
      block();
    }
    error.classList.add("show");
  }
}

function block(){
  blocked=true;
  let time=30;
  btnEnter.disabled=true;
  error.innerText=`Bloqueado • ${time}s`;
  timer=setInterval(()=>{
    time--;
    error.innerText=`Bloqueado • ${time}s`;
    if(time<=0){
      clearInterval(timer);
      blocked=false;
      tries=3;
      btnEnter.disabled=false;
      error.innerText="";
      error.classList.remove("show");
    }
  },1000);
}

function hideError(){
  if(!blocked) error.classList.remove("show");
}

function steps(){
  const s=[
    ["Entrando","inicializando"],
    ["Verificando","checando dados"],
    ["Carregando","preparando"],
    ["Acesso liberado","bem-vindo"]
  ];
  let i=0;
  const t=setInterval(()=>{
    stepTitle.innerText=s[i][0];
    stepText.innerText=s[i][1];
    i++;
    if(i===s.length){
      clearInterval(t);
      setTimeout(()=>{
        entry.style.opacity=0;
        app.style.opacity=1;
        app.style.pointerEvents="all";
      },500);
    }
  },900);
}

function tab(t){
  fun.style.display=t==="fun"?"block":"none";
  info.style.display=t==="info"?"block":"none";
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  event.target.classList.add("active");
}

document.querySelectorAll(".toggle").forEach(t=>t.onclick=()=>t.classList.toggle("on"));

function inject(){
  const btn=document.querySelector(".inject");
  prog.style.display="block";bar.style.width="0%";
  msg.className="msg";btn.classList.add("injecting");
  let p=0;
  const steps=["Inicializando…","Sincronizando…","Aplicando…","Finalizando…"];
  let i=0;msg.innerText=steps[0];
  const it=setInterval(()=>{
    p+=2;bar.style.width=p+"%";
    if(p%25===0&&i<steps.length-1){i++;msg.innerText=steps[i]}
    if(p>=100){
      clearInterval(it);
      btn.classList.remove("injecting");
      msg.innerText="Injetado!";
      msg.classList.add("done");
    }
  },70);
}
</script>

</body>
</html>
